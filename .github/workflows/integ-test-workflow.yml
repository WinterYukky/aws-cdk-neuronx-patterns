name: integ-test-workflow
on:
  pull_request:
    types:
      - opened
      - synchronize
  push:
    branches:
      - main
jobs:
  integ-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "18"
      - name: Install Dependencies
        run: yarn install --frozen-lockfile
      - name: Run Integration Tests
        run: yarn integ
